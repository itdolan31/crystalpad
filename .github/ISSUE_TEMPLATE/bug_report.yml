name: Bug report
description: Report a bug
labels: [ bug ]

body:
  - type: input
    id: android_version
    attributes:
      label: Android version
    validations:
      required: false
  
  - type: input
    id: app_version
    attributes:
      label: App version
    validations:
      required: true
      
  - type: textarea
    id: description
    attributes:
      label: Describe the problem
    validations:
      required: true